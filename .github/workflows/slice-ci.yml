name: slice-ci

on:
  push:
    paths: ["slice/**", ".github/workflows/slice-*.yml"]
  pull_request:
    paths: ["slice/**", ".github/workflows/slice-*.yml"]

jobs:
  contracts:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: slice/contracts
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
      - run: forge build --sizes
      - run: forge test -vv

  agent:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: slice/agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: slice/agent/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: slice/app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: slice/app/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: slice-app
          path: slice/app/dist/index.html
